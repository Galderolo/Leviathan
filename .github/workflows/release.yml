name: Release

# Run by hand on main (Actions → Release → Run workflow) to build installers for
# every platform from that commit and publish them as a GitHub pre-release named
# after the version in package.json, with that version's CHANGELOG section as notes.
# Nothing is uploaded unless every platform builds.
#
# The tag is not pushed beforehand: GitHub creates it when the release is published.
# Its releases feed lists a tag as soon as it exists, and the app's updater (up to
# 0.23.0) looks only at the newest tag listed: while that release was still a draft,
# no copy of the app saw any update.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  # A draft to fill in, with the notes, so the release can be checked before the installers land.
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF_NAME."
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists: set the next version in package.json first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The lines under "## [<version>]" in CHANGELOG.md, up to the next version.
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          printf '\n---\n\n[Code signing policy](https://github.com/%s#code-signing-policy) · [Privacy policy](https://github.com/%s#privacy-policy)\n' "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" >> notes.md
          # A draft has no tag yet, only the commit to tag. One left by an earlier run that failed is reused.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          fi

  # Builds only keep their installers as artifacts: uploading from each build
  # depends on the release still being a draft when that build gets a runner.
  build:
    needs: draft
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Unsigned builds by default. Add signing secrets here when the project has certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  # Only when every platform built: upload everything, then publish (which creates the tag).
  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Upload the installers and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          ls -l installers
          gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
