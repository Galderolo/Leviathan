name: Feature request
description: Suggest an idea or something you miss from other Git clients
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where you needed this.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Leviathan to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do other tools handle it?
      description: Screenshots or descriptions from other Git clients are very welcome.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
