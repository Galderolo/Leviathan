<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A sea serpent whose body is a commit graph: the head is HEAD, the body is
       the main line, the loop is a branch that splits off and merges back. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ece9d"/>
      <stop offset="1" stop-color="#0669f7"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee0ad"/>
      <stop offset="1" stop-color="#139fc0"/>
    </linearGradient>
  </defs>
  <!-- neck frill and dorsal fins -->
  <path d="M15 12 L 4 8 L 11 15 L 3 17 L 12 20 L 6 25 L 18 23 Z" fill="#8e00c2"/>
  <path d="M18 33 L 10 30 L 18 38 Z M18 44 L 11 42 L 18 48 Z" fill="#8e00c2"/>
  <!-- branch loop -->
  <path d="M22 29 C 22 36, 42 33, 42 41 C 42 49, 22 46, 22 52" fill="none" stroke="#c517b6" stroke-width="5.5" stroke-linecap="round"/>
  <!-- main body with curled tail -->
  <path d="M22 18 V 52 C 22 61.5, 35 62.5, 40 58.5 C 43 56, 41.5 52.8, 38.2 53.6" fill="none" stroke="url(#body)" stroke-width="8" stroke-linecap="round"/>
  <!-- commits (scales) -->
  <g stroke="#1b1e24" stroke-width="1.6">
    <circle cx="22" cy="29" r="3.8" fill="#f2ca33"/>
    <circle cx="42" cy="41" r="3.8" fill="#c517b6"/>
    <circle cx="22" cy="41" r="3.8" fill="#2ece9d"/>
    <circle cx="22" cy="52" r="3.8" fill="#f25d2e"/>
  </g>
  <!-- lower jaw -->
  <path d="M15 19 C 21 21.5, 30 19.5, 35 18.6 C 40 18, 44 18.3, 47 19.2 C 43 22.5, 33 24, 25 23.5 C 20 23.2, 16.5 22, 15 19 Z" fill="#139fc0"/>
  <!-- fangs -->
  <path d="M37 16.4 L 38.4 20 L 39.8 16.4 Z M43.5 16 L 44.6 18.8 L 45.7 15.8 Z" fill="#fff"/>
  <!-- head -->
  <path d="M12 16 C 11 8.5, 19 4.5, 28 5.2 C 36 5.8, 44 8.5, 50 12.5 C 49 15, 44 16.2, 38 16.3 C 31 16.4, 25 17.5, 19 19.5 C 15 20.5, 12.5 19, 12 16 Z" fill="url(#head)"/>
  <!-- eye and brow -->
  <ellipse cx="27" cy="10.6" rx="3.4" ry="2.9" fill="#fff"/>
  <ellipse cx="27.8" cy="10.9" rx="1.2" ry="2.2" fill="#1b1e24"/>
  <path d="M22.5 7.4 C 25 6.3, 28.5 6.3, 31.5 7.6" fill="none" stroke="#0b3a43" stroke-width="1.4" stroke-linecap="round"/>
  <!-- nostril -->
  <circle cx="45" cy="10.8" r="0.9" fill="#0b3a43"/>
</svg>
