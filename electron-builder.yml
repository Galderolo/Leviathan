appId: org.calamar.app
productName: Calamar
copyright: Copyright © 2026 Calamar contributors
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
icon: resources/icon.png
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Calamar contributors
publish:
  provider: github
