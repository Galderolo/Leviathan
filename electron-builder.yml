appId: org.leviathan.app
productName: Leviathan
copyright: Copyright © 2026 Leviathan contributors
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
icon: resources/icon.png
# git/ssh execute the askpass scripts from disk, so keep them out of the asar archive.
asarUnpack:
  - resources/askpass/**
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Leviathan contributors
publish:
  provider: github
