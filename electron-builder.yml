# The app shows as "Git Leviathan" (Windows' search finds it typing "git" or "lev"). Inside it stays Leviathan: the
# app id, executable, install folder and user data folder keep updates in place and settings and accounts where they
# were (macOS keeps the token key under the app's name).
appId: org.leviathan.app
productName: Leviathan
copyright: Copyright © 2026 Leviathan contributors
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  # node-pty (the terminal): what runs, without its sources and debug symbols.
  - '!**/node_modules/node-pty/{src,deps,third_party,scripts,typings}/**'
  - '!**/node_modules/node-pty/**/*.{pdb,cc,h,gyp,map,md}'
icon: resources/icon.png
# git/ssh execute the askpass scripts from disk, so keep them out of the asar archive.
asarUnpack:
  - resources/askpass/**
  # node-pty's native module, and the helpers it starts on Windows and macOS, run from disk too.
  - node_modules/node-pty/**
# node-pty is a Node-API module (one build for Node and Electron alike): nothing to rebuild for Electron.
npmRebuild: false
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # An update renames the old "Leviathan" shortcuts (the installer keeps shortcuts and follows a new name).
  shortcutName: Git Leviathan
  uninstallDisplayName: Git Leviathan ${version}
  artifactName: GitLeviathan-${version}-setup.${ext}
portable:
  artifactName: GitLeviathan-${version}-portable.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: GitLeviathan-${version}-${arch}-mac.${ext}
  extendInfo:
    CFBundleDisplayName: Git Leviathan
dmg:
  artifactName: GitLeviathan-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Leviathan contributors
  desktop:
    entry:
      Name: Git Leviathan
appImage:
  artifactName: GitLeviathan-${version}.${ext}
publish:
  provider: github
